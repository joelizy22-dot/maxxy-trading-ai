<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ʍǟӼӼʏ Trading AI</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:#050505;

  color:#ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}

.container{

  max-width:700px;

  margin:auto;

  padding:20px;

}

.header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;

}

.logo{

  font-size:24px;

  font-weight:800;

}

.status{

  font-size:12px;

  color:#00ff88;

}

.card{

  background:#111111;

  border:1px solid #242424;

  border-radius:18px;

  padding:18px;

  margin-bottom:14px;

}

.chart{

  height:280px;

  position:relative;

  overflow:hidden;

  border-radius:14px;

  background:
    linear-gradient(
      rgba(255,255,255,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.035) 1px,
      transparent 1px
    );

  background-size:
    35px 35px;

}

.chart-line{

  position:absolute;

  left:0;

  right:0;

  height:1px;

  background:#444;

}

.support{

  top:72%;

  background:#00ff88;

}

.resistance{

  top:28%;

  background:#ff4d4d;

}

.ema{

  position:absolute;

  width:100%;

  height:2px;

  background:#f4c542;

  top:50%;

  transform:
    rotate(-4deg);

}

.signal{

  text-align:center;

}

.signal-label{

  font-size:13px;

  color:#888;

  margin-bottom:8px;

}

.signal-main{

  font-size:42px;

  font-weight:900;

}

.call{

  color:#00ff88;

}

.put{

  color:#ff4d4d;

}

.wait{

  color:#aaa;

}

.timer{

  font-size:28px;

  font-weight:800;

  margin-top:8px;

}

.expired{

  color:#777;

}

.badge{

  display:inline-block;

  padding:7px 14px;

  border-radius:20px;

  background:#00ff88;

  color:#000;

  font-weight:800;

  margin-top:10px;

}

.badge.put{

  background:#ff4d4d;

  color:#fff;

}

.badge.error{

  background:#555;

  color:#fff;

}

.reason{

  color:#aaa;

  font-size:13px;

  margin-top:10px;

}

.row{

  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-top:10px;

}

.metric{

  flex:1;

  background:#0a0a0a;

  padding:12px;

  border-radius:12px;

}

.metric-title{

  font-size:11px;

  color:#777;

}

.metric-value{

  font-size:15px;

  font-weight:700;

  margin-top:4px;

}

.footer{

  text-align:center;

  color:#555;

  font-size:11px;

  margin-top:20px;

}

</style>

</head>


<body>

<div class="container">


  <div class="header">

    <div class="logo">
      ʍǟӼӼʏ Trading AI
    </div>

    <div class="status">
      ● LIVE DATA
    </div>

  </div>


  <div class="card">

    <div
      style="
        display:flex;
        justify-content:space-between;
        margin-bottom:10px;
      "
    >

      <strong>
        EUR/USD
      </strong>

      <span
        style="
          color:#777;
          font-size:12px;
        "
      >
        1 MIN
      </span>

    </div>


    <div class="chart">

      <div class="chart-line support"></div>

      <div class="chart-line resistance"></div>

      <div class="ema"></div>

    </div>

  </div>


  <div class="card signal">

    <div class="signal-label">
      CURRENT SIGNAL
    </div>


    <div
      id="sig"
      class="signal-main wait"
    >
      WAIT
    </div>


    <div
      id="timer"
      class="timer"
    >
      --
    </div>


    <div
      id="badge"
      class="badge"
    >
      WAIT
    </div>


    <div
      id="reason"
      class="reason"
    >
      Waiting for market confirmation...
    </div>

  </div>


  <div class="card">

    <div class="row">

      <div class="metric">

        <div class="metric-title">
          EMA
        </div>

        <div
          id="emaValue"
          class="metric-value"
        >
          --
        </div>

      </div>


      <div class="metric">

        <div class="metric-title">
          SUPPORT
        </div>

        <div
          id="supportValue"
          class="metric-value"
        >
          --
        </div>

      </div>


      <div class="metric">

        <div class="metric-title">
          RESISTANCE
        </div>

        <div
          id="resistanceValue"
          class="metric-value"
        >
          --
        </div>

      </div>

    </div>

  </div>


  <div class="footer">

    TEST MODE • 3 MIN TRADE EXPIRY

  </div>


</div>


<script>


/* =========================================
   CONFIGURATION
========================================= */

const API_URL =
  "https://maxxy-market-api.joelizy22.workers.dev/eurusd";


const EMA_LENGTH =
  50;


const SR_LOOKBACK =
  20;


/* =========================================
   STATE
========================================= */

let signalLocked =
  false;


let lockedSignal =
  null;


let signalTimer =
  null;


let currentData =
  null;


/*
  NEW:

  Stores the exact real-world time
  when the 12-second entry window ends.
*/

let maxxyEntryEndsAt =
  null;


/* =========================================
   BASIC HELPERS
========================================= */

function setSignal(
  type,
  reason
){

  const sig =
    document.getElementById("sig");

  const reasonBox =
    document.getElementById("reason");

  sig.textContent =
    type;

  sig.className =
    "signal-main " +
    (
      type === "CALL"
        ? "call"
        :
      type === "PUT"
        ? "put"
        :
        "wait"
    );

  reasonBox.textContent =
    reason;

}


/* =========================================
   EMA
========================================= */

function calculateEMA(
  candles,
  length
){

  if(
    candles.length <
    length
  ){

    return null;

  }


  const closes =
    candles.map(
      c => Number(c.close)
    );


  const multiplier =
    2 / (length + 1);


  let ema =
    closes
      .slice(
        0,
        length
      )
      .reduce(
        (a,b) => a + b,
        0
      ) / length;


  for(
    let i = length;
    i < closes.length;
    i++
  ){

    ema =
      (
        closes[i] - ema
      ) *
      multiplier +
      ema;

  }


  return ema;

}


/* =========================================
   SIGNAL ENGINE
========================================= */

function strategy(
  candles
){

  if(
    candles.length <
    60
  ){

    return {
      type:"WAIT",
      reason:"Not enough market data."
    };

  }


  const last =
    candles[
      candles.length - 1
    ];


  const previous =
    candles[
      candles.length - 2
    ];


  const ema50 =
    calculateEMA(
      candles,
      EMA_LENGTH
    );


  if(
    ema50 === null
  ){

    return {
      type:"WAIT",
      reason:"EMA data unavailable."
    };

  }


  const closes =
    candles.map(
      c => Number(c.close)
    );


  const highs =
    candles.map(
      c => Number(c.high)
    );


  const lows =
    candles.map(
      c => Number(c.low)
    );


  const support =
    Math.min(
      ...lows.slice(
        -SR_LOOKBACK
      )
    );


  const resistance =
    Math.max(
      ...highs.slice(
        -SR_LOOKBACK
      )
    );


  const close =
    Number(last.close);


  const open =
    Number(last.open);


  const high =
    Number(last.high);


  const low =
    Number(last.low);


  const previousHigh =
    Number(previous.high);


  const previousLow =
    Number(previous.low);


  const range =
    Math.max(
      high - low,
      0.00000001
    );


  const body =
    Math.abs(
      close - open
    );


  const upperWick =
    high -
    Math.max(
      open,
      close
    );


  const lowerWick =
    Math.min(
      open,
      close
    ) -
    low;


  const bullish =
    close > open;


  const bearish =
    close < open;


  const bullishTrend =
    close > ema50;


  const bearishTrend =
    close < ema50;


  const levelRange =
    Math.max(
      resistance - support,
      0.00000001
    );


  const nearSupport =
    (
      close - support
    ) /
    levelRange
    <=
    0.15;


  const nearResistance =
    (
      resistance - close
    ) /
    levelRange
    <=
    0.15;


  const bullishRejection =
    bullish &&
    lowerWick >=
    Math.max(
      body * 1.2,
      range * 0.20
    );


  const bearishRejection =
    bearish &&
    upperWick >=
    Math.max(
      body * 1.2,
      range * 0.20
    );


  /*
    BREAKOUT CALL
  */

  if(
    bullishTrend &&
    bullish &&
    close >
    previousHigh
  ){

    return {
      type:"CALL",
      reason:
        "Bullish breakout confirmed above the previous candle."
    };

  }


  /*
    BREAKOUT PUT
  */

  if(
    bearishTrend &&
    bearish &&
    close <
    previousLow
  ){

    return {
      type:"PUT",
      reason:
        "Bearish breakout confirmed below the previous candle."
    };

  }


  /*
    SUPPORT REJECTION
  */

  if(
    bullishTrend &&
    nearSupport &&
    bullishRejection
  ){

    return {
      type:"CALL",
      reason:
        "Bullish rejection confirmed near support."
    };

  }


  /*
    RESISTANCE REJECTION
  */

  if(
    bearishTrend &&
    nearResistance &&
    bearishRejection
  ){

    return {
      type:"PUT",
      reason:
        "Bearish rejection confirmed near resistance."
    };

  }


  return {
    type:"WAIT",
    reason:
      "No strong confirmation yet."
  };

}


/* =========================================
   FINISH ENTRY WINDOW
========================================= */

function expireSignal(){

  clearInterval(
    signalTimer
  );


  signalTimer =
    null;


  signalLocked =
    false;


  lockedSignal =
    null;


  maxxyEntryEndsAt =
    null;


  const timer =
    document.getElementById(
      "timer"
    );


  timer.textContent =
    "EXPIRED";


  timer.className =
    "timer expired";


  const current =
    document.getElementById(
      "sig"
    ).textContent;


  if(
    current === "CALL" ||
    current === "PUT"
  ){

    const badge =
      document.getElementById(
        "badge"
      );


    badge.textContent =
      "EXPIRED";


    badge.className =
      "badge error";

  }

}


/* =========================================
   UPDATE COUNTDOWN
========================================= */

function updateSignalCountdown(){

  if(
    !maxxyEntryEndsAt
  ){

    return;

  }


  const remaining =
    Math.max(
      0,
      maxxyEntryEndsAt -
      Date.now()
    );


  if(
    remaining <= 0
  ){

    expireSignal();

    return;

  }


  const seconds =
    Math.ceil(
      remaining / 1000
    );


  const timer =
    document.getElementById(
      "timer"
    );


  timer.textContent =
    seconds + "s";

}


/* =========================================
   LOCK SIGNAL
========================================= */

function lockSignal(
  type,
  reason
){

  signalLocked =
    true;


  lockedSignal =
    type;


  clearInterval(
    signalTimer
  );


  setSignal(
    type,
    reason
  );


  const timer =
    document.getElementById(
      "timer"
    );


  const badge =
    document.getElementById(
      "badge"
    );


  /*
    IMPORTANT:

    Use real wall-clock time.

    The countdown therefore remains
    accurate even if Telegram pauses
    the JavaScript timer while you are
    inside ExpertOption.
  */

  maxxyEntryEndsAt =
    Date.now() + 12000;


  timer.className =
    "timer";


  badge.textContent =
    type;


  badge.className =
    "badge " +
    (
      type === "PUT"
        ? "put"
        : ""
    );


  /*
    Update immediately.
  */

  updateSignalCountdown();


  /*
    Update frequently while visible.
  */

  signalTimer =
    setInterval(
      updateSignalCountdown,
      250
    );

}


/* =========================================
   TELEGRAM / MOBILE RETURN FIX
========================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    /*
      When you return to Telegram,
      immediately calculate the real
      remaining time.
    */

    if(
      document.visibilityState ===
      "visible"
    ){

      updateSignalCountdown();

    }

  }
);


/* =========================================
   MARKET ANALYSIS
========================================= */

async function analyze(){

  /*
    Do not overwrite a fresh signal
    during its 12-second entry window.
  */

  if(
    signalLocked
  ){

    return;

  }


  try{

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Market data request failed."
      );

    }


    const data =
      await response.json();


    if(
      !data ||
      !Array.isArray(
        data.values
      )
    ){

      throw new Error(
        "Invalid market data."
      );

    }


    /*
      Twelve Data normally returns
      newest candle first.

      Reverse it so the oldest candle
      comes first.
    */

    let candles =
      [
        ...data.values
      ].reverse();


    /*
      Ignore the newest forming candle.

      We only analyze a fully closed
      1-minute candle.
    */

    if(
      candles.length > 1
    ){

      candles =
        candles.slice(
          0,
          -1
        );

    }


    currentData =
      candles;


    const result =
      strategy(
        candles
      );


    /*
      Display metrics.
    */

    const ema =
      calculateEMA(
        candles,
        EMA_LENGTH
      );


    const lows =
      candles.map(
        c => Number(c.low)
      );


    const highs =
      candles.map(
        c => Number(c.high)
      );


    const support =
      Math.min(
        ...lows.slice(
          -SR_LOOKBACK
        )
      );


    const resistance =
      Math.max(
        ...highs.slice(
          -SR_LOOKBACK
        )
      );


    document.getElementById(
      "emaValue"
    ).textContent =
      ema
        ? ema.toFixed(5)
        : "--";


    document.getElementById(
      "supportValue"
    ).textContent =
      Number(
        support
      ).toFixed(5);


    document.getElementById(
      "resistanceValue"
    ).textContent =
      Number(
        resistance
      ).toFixed(5);


    /*
      Strong signal.
    */

    if(
      result.type === "CALL" ||
      result.type === "PUT"
    ){

      lockSignal(
        result.type,
        result.reason
      );

    }

    /*
      Otherwise WAIT.
    */

    else{

      setSignal(
        "WAIT",
        result.reason
      );


      const badge =
        document.getElementById(
          "badge"
        );


      badge.textContent =
        "WAIT";


      badge.className =
        "badge";


      document.getElementById(
        "timer"
      ).textContent =
        "--";

    }

  }
  catch(error){

    console.error(
      error
    );


    setSignal(
      "WAIT",
      "Unable to refresh market data."
    );


    document.getElementById(
      "badge"
    ).textContent =
      "DATA ERROR";


    document.getElementById(
      "badge"
    ).className =
      "badge error";

  }

}


/* =========================================
   START
========================================= */

analyze();


/*
  Refresh market analysis every
  30 seconds.
*/

setInterval(
  analyze,
  30000
);

</script>

</body>

</html>
